name: website-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not published to the host - only the web service needs to reach it,
    # over the compose-internal network.

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: website.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL}
      EMAIL_URL: ${EMAIL_URL}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      # Defaults to true (redirect HTTP -> HTTPS). Set to false in
      # .env.prod when this VM sits behind another reverse proxy that
      # already terminates TLS and forwards plain HTTP here (e.g.
      # CloudPanel) - Caddy's own X-Forwarded-Proto reflects its own
      # (non-TLS) connection to this container, not the original client's,
      # so Django would otherwise redirect-loop.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
    volumes:
      # Named volume, not a bind mount: uploaded images/documents persist
      # across `docker compose up --build` and container recreation, live
      # entirely on this VM (no S3/object storage involved).
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # No ports: published here - only reachable from other containers on
    # this compose network (i.e. Caddy). Do not add a `ports:` mapping
    # unless you're intentionally bypassing the reverse proxy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host port 8080, not 80: rootless Docker can't bind privileged
      # ports (<1024) without extra host configuration. If Docker here
      # isn't rootless, or you've configured
      # net.ipv4.ip_unprivileged_port_start, change this back to "80:80"
      # (and add "443:443" if Caddy is doing its own TLS - see Caddyfile).
      - "8080:80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Same volume as web's /app/media, mounted read-only - Caddy serves
      # /media/* directly from here instead of proxying to Django.
      - media_data:/srv/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
