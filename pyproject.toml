[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "website",
    "home",
    "search",
    "base",
    "about",
    "projects",
    "blog",
    "contact",
]

[tool.ruff.lint.per-file-ignores]
# dev.py/production.py intentionally build on `from .base import *`.
"website/settings/dev.py" = ["F403", "F405"]
"website/settings/production.py" = ["F403", "F405"]
